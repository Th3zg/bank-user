spring:
  profiles:
    active: dev
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://user-db:5432/user_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000

  couchbase:
    connection-string: couchbase://user-db-couchbase
    username: admin
    password: password
    bucket:
      name: user_services_bucket

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: user-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: false # Confirmación Manual de Offsets
      properties:
        spring.json.trusted.packages: "" # com.yourbank.events
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  redis:
    host: shared-redis
    port: 6379

  elasticsearch:
    uris: http://shared-elasticsearch:9200
    connection-timeout: 1s
    socket-timeout: 30s
    username: elastic

server:
  port: 8084

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG

resilience4j:
  retry:
    instances:
      kafkaSenderRetry:
        max-attempts: 3
        wait-duration: 2s

  circuitbreaker:
    instances:
      kafkaSenderBreaker:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s